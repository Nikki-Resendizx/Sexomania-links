<script type="module">

const favKey="sexomania_favoritos";

const esActivo=c=>c.activo!==false;
const esNuevo=c=>{if(c.nuevo===true)return true; if(!c.fecha||!c.fecha.toDate)return false; return (Date.now()-c.fecha.toDate().getTime())<604800000;};

  const orden=document.getElementById("orden")?.value||"popular";
  if(orden==="nombre") db.sort((a,b)=>String(a.nombre||"").localeCompare(String(b.nombre||"")));
  else if(orden==="reciente") db.sort((a,b)=>fechaMs(b)-fechaMs(a));
  else if(orden==="favoritos") db.sort((a,b)=>Number(favoritos().includes(b.id))-Number(favoritos().includes(a.id)));
  else db.sort((a,b)=>Number(b.clicks||0)-Number(a.clicks||0));

  if(telegramId)return "tg_"+String(telegramId);

window.calificar=async estrellas=>{

      actual.ratingVotes=votes;
      actual.ratingCount=Number(actual.ratingCount||0)+(previous?0:1);
      actual.ratingTotal=Number(actual.ratingTotal||0)-previous+Number(estrellas);
      pintarCalificacion(actual);
    }
    document.getElementById("ratingSummary").textContent="¡Gracias por tu calificación!";
  }catch(e){alert("No se pudo guardar tu calificación: "+e.message);}
  finally{document.querySelectorAll(".rating-btn").forEach(b=>b.disabled=false);}
};
window.ver=async id=>{
  let c=todos.find(x=>x.id===id); if(!c||!esActivo(c))return; modalId=id;
  document.getElementById("fFoto").src=c.foto; document.getElementById("fNombre").innerText=c.nombre;
  document.getElementById("fCategoria").innerText="☛ "+c.seccion+" ☚";
  document.getElementById("fStats").innerText="𓁻 "+(c.clicks||0)+" VISTAS"+(c.destacado?" • 📌 DESTACADO":"");
  document.getElementById("fDesc").innerText=c.desc||"Sin descripción";
  pintarCalificacion(c);
  let l=document.getElementById("fLink"); l.href=c.link;
  l.onclick=async()=>{try{await upDoc(docu(db,"chats",id),{clicks:incr(1)})}catch(e){}};
  document.getElementById("modal").style.display="block";
};
window.cerrar=()=>{document.getElementById("modal").style.display="none";modalId=null;};
window.reportar=()=>{let c=todos.find(x=>x.id===modalId);if(c&&c.reporte)window.open(c.reporte,"_blank");else alert("El enlace de reporte no está configurado.");};
let sharedPostOpened=false;
onSnapshot(col(db,"chats"),snap=>{
  todos=[];snap.forEach(d=>todos.push({id:d.id,...d.data()}));if(sec)render();
  const startParam=window.Telegram?.WebApp?.initDataUnsafe?.start_param||"";
  const sharedMatch=String(startParam).match(/^c_([A-Za-z0-9_-]{1,60})$/);
  const categoryMatch=String(startParam).match(/^cat_([a-z0-9_]{1,40})$/);
  if(sharedMatch&&!sharedPostOpened){sharedPostOpened=true;window.Telegram?.WebApp?.ready?.();window.ver(sharedMatch[1]);}
  else if(categoryMatch&&!sharedPostOpened){sharedPostOpened=true;const categoryMap={canales_adultos:"CANALES ADULTOS",grupos_adultos:"GRUPOS ADULTOS",ventas_mas18:"VENTAS +18",publicitarios:"PUBLICITARIOS",entretenimiento:"ENTRETENIMIENTO",arte:"ARTE",venta_articulos:"VENTA ARTICULOS",bots:"BOTS"};const target=categoryMap[categoryMatch[1]];if(target){window.Telegram?.WebApp?.ready?.();window.openSec(target);}}
  if(modalId){let actual=todos.find(x=>x.id===modalId);if(actual){document.getElementById("fStats").innerText="𓁻 "+(actual.clicks||0)+" VISTAS"+(actual.destacado?" • 📌 DESTACADO":"");pintarCalificacion(actual);}}
});
