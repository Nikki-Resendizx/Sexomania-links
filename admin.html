<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin - SEXOMANIA</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC6eyDXaTCPgcb_se9vVP4rfwVkdc0ayn0",
  authDomain: "sexomania-links.firebaseapp.com",
  projectId: "sexomania-links",
  storageBucket: "sexomania-links.firebasestorage.app",
  messagingSenderId: "1061811152332",
  appId: "1:1061811152332:web:8d75649506182236862969",
  measurementId: "G-6JYYBD18CH"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db=db; window.col=collection; window.add=addDoc; window.del=deleteDoc; window.docu=doc; window.onSnap=onSnapshot; window.stamp=serverTimestamp; window.upd=updateDoc;
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial;min-height:100vh}
#login{position:fixed;inset:0;background:radial-gradient(ellipse at top,#2a0000,#000);display:flex;align-items:center;justify-content:center;z-index:100;padding:15px}
.login-box{background:#140000;border:2px solid red;border-radius:22px;padding:25px;width:100%;max-width:340px;text-align:center;box-shadow:0 0 40px rgba(255,0,0,0.5)}
.login-box h2{color:#ff3333;text-shadow:0 0 10px red;margin:0 0 5px;font-size:22px}
.login-box p{color:#ff9999;font-size:12px;margin:0 0 18px}
.input-pass{width:100%;padding:14px 16px;border-radius:30px;border:2px solid #5a0000;background:#1f0000;color:#fff;outline:none;font-size:16px;text-align:center;letter-spacing:2px}
.input-pass:focus{border-color:red;box-shadow:0 0 15px rgba(255,0,0,0.5)}
.btn-login{width:100%;margin-top:12px;padding:14px;background:linear-gradient(90deg,red,#ff3333);border:none;border-radius:30px;color:#fff;font-weight:900;cursor:pointer;font-size:14px;letter-spacing:1px}
.btn-login:active{transform:scale(0.97)}
#error{color:#ff4444;font-size:12px;margin-top:10px;display:none}
#panel{display:none;padding:14px;padding-bottom:100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:0;background:rgba(0,0,0,0.9);padding:10px 0;z-index:10;border-bottom:2px solid #2a0000}
.card{background:#140000;border:1px solid #5a0000;border-radius:16px;padding:14px;margin:12px 0}
input,textarea,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #5a0000;background:#1f0000;color:#fff}
.btn{padding:11px 16px;border-radius:20px;border:none;font-weight:900;cursor:pointer}
.btn-add{background:linear-gradient(90deg,red,#ff6600);color:#fff;width:100%;margin-top:8px}
.btn-del{background:#3a0000;color:#ff7777;border:1px solid #6a0000;padding:6px 12px;font-size:11px;border-radius:20px}
.item{display:flex;justify-content:space-between;align-items:center;background:#1f0000;border:1px solid #3a0000;padding:10px 12px;border-radius:12px;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#190000;border:1px solid #4a0000;border-radius:12px;padding:12px;text-align:center}.checkrow{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.checkrow label{background:#190000;border:1px solid #4a0000;padding:8px 10px;border-radius:12px}.filter{margin-top:15px}
.cat-group{background:#090000;border:1px solid #3d0000;border-radius:16px;margin:14px 0;padding:10px;overflow:hidden}
.cat-title{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,#250000,#110000);border-bottom:1px solid #5a0000;color:#ff4d4d;padding:11px 10px;border-radius:11px;font-size:12px;font-weight:900}
.cat-count{background:#3a0000;color:#fff;border:1px solid #6a0000;border-radius:20px;padding:4px 8px;font-size:10px;white-space:nowrap}
</style></head><body>

<!-- LOGIN RESTRINGIDO - NO SE VE CONTRASEÑA EN LA BARRA -->
<div id="login">
<div class="login-box">
<div style="font-size:40px;margin-bottom:8px">🔐</div>
<h2>ACCESO RESTRINGIDO</h2>
<p>Panel exclusivo Sexomania</p>
<input type="password" id="pass" class="input-pass" placeholder="••••••••" autocomplete="current-password">
<button class="btn-login" onclick="check()">ENTRAR 🔥</button>
<div id="error">❌ Contraseña incorrecta</div>
<a href="index.html" style="display:block;margin-top:14px;color:#ff7777;font-size:11px;text-decoration:none">← Volver al inicio</a>
</div>
</div>

<div id="panel">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<span style="color:#ff3333;font-size:12px;font-weight:bold">🔥 Panel Sexomania</span>
<button onclick="logout()" style="background:#1f0000;color:#ff7777;border:1px solid #5a0000;padding:5px 12px;border-radius:20px;font-size:11px">Salir 🔒</button>
</div>

<label>SECCIÓN</label>
<select id="seccion">
<option>CANALES ADULTOS</option><option>GRUPOS ADULTOS</option><option>VENTAS</option>
<option>PUBLICITARIOS</option><option>ENTRETENIMIENTO</option><option>ARTE</option><option value="Venta de Articulos">💰(𝐂 & 𝐆) 𝐃𝐞 𝐕𝐞𝐧𝐭𝐚𝐬 𝐃𝐞 𝐀𝐫𝐭𝐢𝐜𝐮𝐥𝐨𝐬💰</option><option>BOTS</option>
</select>

<label>FOTO DE PERFIL DEL CANAL/GRUPO</label>
<div class="upload-box">
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="cargarGaleria(this)">
<button type="button" class="btn" style="background:#111;border:1px solid #ff0000;color:#ff6a6a" onclick="document.getElementById('fileInput').click()">📸 ELEGIR DE GALERÍA</button>
<input id="foto" placeholder="https://... o base64" oninput="preview(this.value)">
<img id="prev" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px;display:none;border:1px solid red">
</div>

<label>NOMBRE DEL GRUPO O CANAL</label><input id="nombre" placeholder="Ej: 🔥 Putitas CDMX 🔥">
<label>DESCRIPCIÓN / BIOGRAFÍA</label><textarea id="desc" rows="4" placeholder="De que trata..."></textarea>
<label>LINK DE ACCESO (t.me/...)</label><input id="link" placeholder="https://t.me/..."><label>ETIQUETA</label><select id="etiqueta"><option value="">Sin etiqueta</option><option>DESTACADO</option><option>PREMIUM</option><option>NUEVO</option><option>18+</option></select><label>TAGS (separados por coma)</label><input id="tags" placeholder="viral, mexico, premium"><label>LINK PARA REPORTES (opcional)</label><input id="reporte" placeholder="https://t.me/..."><div class="checkrow"><label>📌 <input type="checkbox" id="destacado"> Destacar</label><label>🟢 <input type="checkbox" id="activo" checked> Activo</label><label>🆕 <input type="checkbox" id="nuevo"> Marcar nuevo</label></div>

<button id="btnG" class="btn btn-add" onclick="guardar()">🔥 PUBLICAR 🔥</button>
<button id="btnC" class="btn" style="background:#222;color:silver;display:none;width:100%;margin-top:8px" onclick="cancelar()">CANCELAR</button>

<div style="margin-top:20px">
<h3 style="color:#ff0000;font-size:14px">📊 Estadísticas</h3><div class="stats"><div class="stat">📋<br><b id="totalChats">0</b><br><small>Publicaciones</small></div><div class="stat">👁️<br><b id="totalViews">0</b><br><small>Visitas</small></div><div class="stat">🟢<br><b id="activeChats">0</b><br><small>Activos</small></div><div class="stat">📌<br><b id="featuredChats">0</b><br><small>Destacados</small></div></div><h3 style="color:#ff0000;font-size:14px">📋 Chats agregados (<span id="count">0</span>)</h3><input class="filter" id="filtroAdmin" placeholder="🔎 Buscar por nombre o categoría..." oninput="listar()"><div id="lista"></div>
<a href="index.html" style="display:block;text-align:center;color:silver;margin-top:15px;font-size:12px">← Ver Mini App</a>
</div>
</div>

<script>
const CLAVE="sexomania2024";let editId=null,cache=[];
function check(){let p=document.getElementById("pass").value;if(p===CLAVE){sessionStorage.setItem("sexo_admin","ok");document.getElementById("login").style.display="none";document.getElementById("panel").style.display="block";iniciar();}else{document.getElementById("error").style.display="block";document.getElementById("pass").value="";setTimeout(()=>document.getElementById("error").style.display="none",2000);}}
window.logout=()=>{sessionStorage.removeItem("sexo_admin");location.reload()};
if(sessionStorage.getItem("sexo_admin")==="ok"){document.getElementById("login").style.display="none";document.getElementById("panel").style.display="block";setTimeout(iniciar,400);}
document.getElementById("pass").addEventListener("keypress",e=>{if(e.key==="Enter")check()});
function cargarGaleria(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{document.getElementById("foto").value=e.target.result;preview(e.target.result)};r.readAsDataURL(f);}
window.preview=u=>{let img=document.getElementById("prev");if(u.length>10){img.src=u;img.style.display="block";img.onerror=()=>img.style.display="none";}};
function iniciar(){onSnap(col(db,"chats"),snap=>{cache=[];snap.forEach(d=>cache.push({id:d.id,...d.data()}));listar();estadisticas();});}
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const CATEGORIAS=[{id:"CANALES ADULTOS",label:"🔞 𝐂𝐚𝐧𝐚𝐥𝐞𝐬 𝐃𝐞 𝐀𝐩𝐨𝐫𝐭𝐞𝐬 𝐗𝐗𝐗 🔞"},{id:"GRUPOS ADULTOS",label:"🔞 𝐆𝐫𝐮𝐩𝐨𝐬 𝐃𝐞 𝐀𝐩𝐨𝐫𝐭𝐞𝐬 𝐗𝐗𝐗 🔞"},{id:"VENTAS",label:"💸 𝐆𝐫𝐮𝐩𝐨𝐬 𝐝𝐞 𝐕𝐞𝐧𝐭𝐚𝐬 ✚𝟏𝟖 💸"},{id:"PUBLICITARIOS",label:"📢 𝐂𝐚𝐧𝐚𝐥𝐞𝐬 & 𝐆𝐫𝐮𝐩𝐨𝐬 𝐏𝐮𝐛𝐥𝐢𝐜𝐢𝐭𝐚𝐫𝐢𝐨𝐬 📢"},{id:"ENTRETENIMIENTO",label:"🍿 (𝐂 & 𝐆) 𝐃𝐞 𝐄𝐧𝐭𝐫𝐞𝐭𝐞𝐧𝐢𝐦𝐢𝐞𝐧𝐭𝐨🍿"},{id:"ARTE",label:"🎨 𝐂𝐚𝐧𝐚𝐥𝐞𝐬 & 𝐆𝐫𝐮𝐩𝐨𝐬 𝐃𝐞 𝐀𝐫𝐭𝐞𝐬 🎨"},{id:"Venta de Articulos",label:"💰(𝐂 & 𝐆) 𝐃𝐞 𝐕𝐞𝐧𝐭𝐚𝐬 𝐃𝐞 𝐀𝐫𝐭𝐢𝐜𝐮𝐥𝐨𝐬💰"},{id:"BOTS",label:"🤖 𝐋𝐨𝐬 𝐌𝐞𝐣𝐨𝐫𝐞𝐬 𝐁𝐎𝐓𝐒 🤖"}];
function itemHTML(c){return '<div class="item"><img src="'+esc(c.foto||"")+'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid red"><div style="flex:1;margin-left:10px;text-align:left"><b style="font-size:12px;color:#ff6a6a">'+esc(c.nombre)+'</b><br><span style="font-size:10px;color:silver">👁️ '+(c.clicks||0)+(c.destacado?" • 📌":"")+(c.nuevo?" • 🆕":"")+(c.activo===false?" • 🔴 OCULTO":"")+'</span></div><div style="display:flex;gap:5px"><button class="btn-del" style="background:#222" onclick="editar(\\''+c.id+'\\')">✏️</button><button class="btn-del" style="background:#111" onclick="alternarEstado(\\''+c.id+'\\')">'+(c.activo===false?"🟢":"🔴")+'</button><button class="btn-del" style="background:#552b00" onclick="destacar(\\''+c.id+'\\')">📌</button><button class="btn-del" style="background:red;color:#fff" onclick="borrar(\\''+c.id+'\\')">🗑️</button></div></div>';}
function listar(){let q=(document.getElementById("filtroAdmin")?.value||"").toLowerCase().trim();let arr=cache.filter(c=>String(c.nombre||"").toLowerCase().includes(q)||String(c.seccion||"").toLowerCase().includes(q));document.getElementById("count").innerText=cache.length;if(!arr.length){document.getElementById("lista").innerHTML='<p style="color:#555;font-size:11px">No hay coincidencias</p>';return;}let html="";CATEGORIAS.forEach(cat=>{let items=arr.filter(c=>c.seccion===cat.id);if(!items.length)return;html+='<section class="cat-group"><div class="cat-title"><span>'+cat.label+'</span><span class="cat-count">'+items.length+'</span></div>'+items.map(itemHTML).join("")+'</section>';});let otros=arr.filter(c=>!CATEGORIAS.some(cat=>cat.id===c.seccion));if(otros.length)html+='<section class="cat-group"><div class="cat-title"><span>📂 OTRAS / SIN CATEGORÍA</span><span class="cat-count">'+otros.length+'</span></div>'+otros.map(itemHTML).join("")+'</section>';document.getElementById("lista").innerHTML=html||'<p style="color:#555;font-size:11px">No hay coincidencias</p>';}
function estadisticas(){document.getElementById("totalChats").innerText=cache.length;document.getElementById("totalViews").innerText=cache.reduce((n,c)=>n+Number(c.clicks||0),0);document.getElementById("activeChats").innerText=cache.filter(c=>c.activo!==false).length;document.getElementById("featuredChats").innerText=cache.filter(c=>c.destacado===true).length;}
window.guardar=async()=>{let datos={seccion:document.getElementById("seccion").value,foto:document.getElementById("foto").value.trim(),nombre:document.getElementById("nombre").value.trim(),desc:document.getElementById("desc").value.trim(),link:document.getElementById("link").value.trim(),etiqueta:document.getElementById("etiqueta").value,tags:document.getElementById("tags").value.split(",").map(x=>x.trim()).filter(Boolean),reporte:document.getElementById("reporte").value.trim(),destacado:document.getElementById("destacado").checked,activo:document.getElementById("activo").checked,nuevo:document.getElementById("nuevo").checked,fecha:stamp()};if(!datos.foto||!datos.nombre||!datos.link){alert("Falta foto, nombre y link");return;}try{if(editId)await upd(docu(db,"chats",editId),datos);else{datos.clicks=0;await add(col(db,"chats"),datos);}limpiar();}catch(e){alert("Error: "+e.message);}};
window.editar=id=>{let c=cache.find(x=>x.id===id);if(!c)return;editId=id;document.getElementById("seccion").value=c.seccion;document.getElementById("foto").value=c.foto||"";preview(c.foto||"");document.getElementById("nombre").value=c.nombre||"";document.getElementById("desc").value=c.desc||"";document.getElementById("link").value=c.link||"";document.getElementById("etiqueta").value=c.etiqueta||"";document.getElementById("tags").value=Array.isArray(c.tags)?c.tags.join(", "):"";document.getElementById("reporte").value=c.reporte||"";document.getElementById("destacado").checked=c.destacado===true;document.getElementById("activo").checked=c.activo!==false;document.getElementById("nuevo").checked=c.nuevo===true;document.getElementById("btnG").innerText="💾 GUARDAR CAMBIOS";document.getElementById("btnC").style.display="block";window.scrollTo({top:0,behavior:"smooth"});};
window.alternarEstado=async id=>{let c=cache.find(x=>x.id===id);if(c)await upd(docu(db,"chats",id),{activo:c.activo===false});};
window.destacar=async id=>{let c=cache.find(x=>x.id===id);if(c)await upd(docu(db,"chats",id),{destacado:c.destacado!==true});};
window.borrar=async id=>{if(!confirm("¿Borrar este chat?"))return;await del(docu(db,"chats",id));};
window.cancelar=()=>limpiar();
function limpiar(){editId=null;["foto","nombre","desc","link","tags","reporte"].forEach(id=>document.getElementById(id).value="");document.getElementById("etiqueta").value="";document.getElementById("destacado").checked=false;document.getElementById("activo").checked=true;document.getElementById("nuevo").checked=false;document.getElementById("prev").style.display="none";document.getElementById("btnG").innerText="🔥 PUBLICAR 🔥";document.getElementById("btnC").style.display="none";}
</script></script>
</body>
</html>
